# The Cargo project nuclo-native-ts writes for `--target linux`: this runtime plus the generated
# src/app.rs. Build with `cargo build --offline --release`.
[package]
name = "nuclo-app"
version = "0.0.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
ureq = "3.5"
serde_json = "1"
unicode-normalization = "0.1"

[profile.release]
strip = true
