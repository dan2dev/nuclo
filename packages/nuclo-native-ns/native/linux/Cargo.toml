# The Cargo project of the Linux (GTK 4 / libadwaita) build. scripts/build.ts writes build/linux/src:
# the generated modules, native.rs, nns_rt.rs, and the Rust runtime of nuclo with its GTK backend.
[package]
name = "nuclo-native-ns"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
ureq = "3.5"
serde_json = "1"
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
strip = true
lto = "thin"
