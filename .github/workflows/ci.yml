name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nuclo-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: packages/nuclo-core
      - run: npx vitest run --coverage
        working-directory: packages/nuclo-core
      - run: bun run build
        working-directory: packages/nuclo-core

  nuclo-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/nuclo-core
      - run: bun run test
        working-directory: packages/nuclo-router
      - run: bun run build
        working-directory: packages/nuclo-router

  # A package changed when its directory differs from the commit of its last
  # release tag (v* for nuclo-core, nuclo-router-v* for nuclo-router).
  # create-nuclo is released in lockstep with nuclo-core, under the same v* tag.
  detect:
    runs-on: ubuntu-latest
    outputs:
      # Publishing only happens on pushes to main that are not bot bump commits.
      release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(') }}
      core: ${{ steps.diff.outputs.core }}
      router: ${{ steps.diff.outputs.router }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          changed() { # $1=tag glob, $2...=paths
            local tag
            tag=$(git describe --tags --match "$1" --abbrev=0 2>/dev/null) || { echo true; return; }
            git diff --quiet "$tag" HEAD -- "${@:2}" && echo false || echo true
          }
          echo "core=$(changed 'v[0-9]*' packages/nuclo-core packages/create-nuclo)" >> "$GITHUB_OUTPUT"
          echo "router=$(changed 'nuclo-router-v*' packages/nuclo-router)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  publish-nuclo:
    needs: [nuclo-core, nuclo-router, detect]
    if: ${{ needs.detect.outputs.release == 'true' && needs.detect.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Bump patch version and refresh docs stats
        working-directory: packages/nuclo-core
        run: |
          bun run build
          (cd ../nuclo-router && bun run build)
          version=$(make --no-print-directory bump-version BUMP=patch)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bun ../../docs/scripts/update-doc-stats.ts
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/nuclo-core/package.json docs/src/generated/nuclo-stats.ts packages/create-nuclo/package.json packages/create-nuclo/templates/basic/package.json README.md packages/*/README.md
          git commit -m "chore(core): bump nuclo-core to $VERSION"
      # A re-run rebuilds the same bump from the same commit. If an earlier
      # attempt already pushed it, skip the push and only publish what's missing.
      - name: Tag and push
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION was already pushed by an earlier attempt"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push --follow-tags
          fi
      - name: Publish
        working-directory: packages/nuclo-core
        run: |
          npm i -g npm@latest
          npm view "nuclo@$VERSION" version >/dev/null 2>&1 || npm publish --provenance --access public
      # Same version as nuclo-core, template pinned to ^$VERSION by bump-version,
      # so `npm create nuclo@latest` always scaffolds the latest nuclo.
      - name: Publish create-nuclo
        working-directory: packages/create-nuclo
        run: npm view "create-nuclo@$VERSION" version >/dev/null 2>&1 || npm publish --provenance --access public

  # Runs after publish-nuclo (never in parallel: both push to main) and checks
  # out main again so it builds on top of the core bump commit, if any.
  publish-router:
    needs: [nuclo-core, nuclo-router, detect, publish-nuclo]
    if: ${{ !cancelled() && needs.detect.outputs.release == 'true' && needs.detect.outputs.router == 'true' && needs.nuclo-core.result == 'success' && needs.nuclo-router.result == 'success' && (needs.publish-nuclo.result == 'success' || needs.publish-nuclo.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Bump patch version and refresh docs stats
        working-directory: packages/nuclo-router
        run: |
          (cd ../nuclo-core && bun run build)
          bun run build
          version=$(make --no-print-directory bump-version BUMP=patch)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bun ../../docs/scripts/update-doc-stats.ts
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/nuclo-router/package.json docs/src/generated/nuclo-stats.ts README.md packages/*/README.md
          git commit -m "chore(router): bump nuclo-router to $VERSION"
      - name: Tag and push
        run: |
          git tag -a "nuclo-router-v$VERSION" -m "Release nuclo-router v$VERSION"
          git push --follow-tags
      - name: Publish
        working-directory: packages/nuclo-router
        run: |
          npm i -g npm@latest
          npm publish --provenance --access public

  deploy-docs:
    needs: [publish-nuclo, publish-router]
    # Deploy main changes even when neither package needs a new release.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Deploy docs to Cloudflare Pages
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:cloudflare -- --branch=main
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
