name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nuclo-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: packages/nuclo-core
      - run: npx vitest run --coverage
        working-directory: packages/nuclo-core
      - run: bun run build
        working-directory: packages/nuclo-core

  publish-nuclo:
    needs: nuclo-core
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(core): bump nuclo-core') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Bump patch version and refresh docs stats
        working-directory: packages/nuclo-core
        run: |
          bun run build
          version=$(make --no-print-directory bump-version BUMP=patch)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bun ../../docs/scripts/update-doc-stats.ts
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/nuclo-core/package.json docs/src/generated/nuclo-stats.ts
          git commit -m "chore(core): bump nuclo-core to $VERSION"
      - name: Publish
        working-directory: packages/nuclo-core
        run: |
          npm i -g npm@latest
          npm publish --provenance --access public
      - name: Tag and push
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push --follow-tags
